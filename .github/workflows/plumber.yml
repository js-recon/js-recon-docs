name: Plumber

on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage]
  workflow_dispatch: null

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  plumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: getplumber/plumber@8cb2c2d8028f9b7bd5d38b394fc84b6294ece3e6 # v0.4.12, 2026-07-20
        with:
          score-push: true
